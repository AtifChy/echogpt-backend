services:
  postgres:
    image: postgres:17-alpine
    container_name: echogpt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: echogpt
      POSTGRES_USER: echogpt
      POSTGRES_PASSWORD: echogpt_dev
    ports:
      - "5432:5432"
    volumes:
      - echogpt_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echogpt -d echogpt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  echogpt_postgres_data:
